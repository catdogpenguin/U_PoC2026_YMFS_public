# 実会場のブース・テーブル定義(46 オブジェクト)。
#
# - kind: booth(体験ブース)/ kitchen_car(キッチンカー)/ table(テーブル・椅子)/
#   waste_station(ゴミステーション。効用によるブース選択の対象外)
#   table は方向・専用出入口を持たず、周囲4辺から着席する。
#   capacity は同時着席可能人数。
# - theme: normal で通常色。normal 以外は自由文字列(意味の分かるラベルにする)で、
#   可視化側(src/visualization.py の booth_style_map)が登場順に自動で色を
#   割り当てラベルとしてそのまま表示する。コード側の色定義追加は不要。
# - area: 所属広場(venue_shape.areas の name)。本体セルがこの広場内に
#   収まることが配置制約になる。
# - width/height: width が正面(長辺)、height が奥行き。受付・退出は常に
#   width 辺(南辺)に配置されるため、実寸(2×3, 3×7)に対して縦横を入れ替えて
#   定義している(例: 実寸 2×3 のブースは width: 3, height: 2)。
# - fixed_position: 通常ブースは [x,y,theta]、方向を持たないテーブルは [x,y]。
#   theta は 0=北, 1=東, 2=南, 3=西(src/venue.py の THETA_*)。受付・退出は
#   通常ブースでは theta の指す辺(正面)に配置されるため、theta は「ブースの向き」を
#   そのまま表す。全ブース南向き(2)で正面が南辺(=長辺)を向く。
#   scripts/run_fixed_layout.py がこの座標で人流シミュレーションを行う。
#   最適化(run_optimization.py)ではこの値は使わず座標・向きを変数として扱う。
# ─────────────────────────────────────────────────────────────────────
# 入力変数の設定根拠(2026-08-17)
#
# 【2026-08-17 追記】mean_service_seconds を全ブース一律 1/3 にした。
#   キッチンカー 90→30 / 屋台 45→15 / 物販 90→30 / ワークショップ 420→140 /
#   大型展示 180→60 / ジャズ 600→200 / ゴミステーション 20→6.7 秒。
#   以下の根拠説明は 1/3 にする前の実測値についてのもの。
#   なお visitor_profiles.yaml の max_visit_seconds が 400 秒のとき、
#   1/3 化前はワークショップ(420秒)とジャズ(600秒)が
#   諦め判定(残り時間 < 推定待ち + 体験時間)に必ず引っかかり
#   誰も入場できなかったが、140秒/200秒になったことで入場可能になる。
#
# 値はすべて「実際のイベント運営でどうか」だけで決めている。
# シミュレーションの KPI(諦め率・混雑度など)に合わせた調整はしていない。
# 出力が悪く出る場合、それは配置か会場条件かモデルの問題であって、
# 入力値を動かして隠すべきものではない。
#
#   capacity             : 同時にサービス/体験できる人数(=窓口数・席数)
#   mean_service_seconds : 1 人あたりの平均提供・体験時間
#   max_queue_length     : 待機列の「セル数」。実効待機人数 =
#                          この値 × booth_geometry.queue_capacity_per_cell(2 人/m²)
#   attractiveness       : [0,1] の相対的な集客力。絶対値に意味はなく序列だけが効く
#
#   キッチンカー(実寸 2×3m)
#     capacity 2  : 調理担当 1 + 受け渡し担当 1。窓口は 1〜2 が実態
#     90 秒       : 注文→調理→受け渡しで 60〜120 秒。焼き物・クレープ等を想定
#                   → 1 台あたり 80 食/時。繁忙期の実運用レンジ
#     待機列 6 セル = 12 人。キッチンカー前の行列は 10〜20 人を想定
#     魅力度 0.90 : 屋外イベントで最も強い誘引
#
#   国際音楽祭屋台(実寸 2×3m)
#     45 秒 : 出来合い・ドリンク中心で受け渡しのみ → 160 食/時
#     魅力度 0.80 : 飲食だが調理待ちがない分だけ滞留の印象は弱い
#
#   物販ブース(実寸 2×3m)
#     capacity 2 : 店員 2 名で接客。6m² のブースに 3 名は詰めすぎ
#     90 秒      : 商品を見る→選ぶ→会計で 60〜120 秒
#     魅力度 0.50 : 通りがかりで寄る程度
#
#   ワークショップ(実寸 2×3m)
#     capacity 4 : 作業テーブル 1 台に 4 名(6m² に 4 名 = 0.67 人/m²)
#     420 秒     : 手芸・工作の体験は 1 回 5〜10 分
#     待機列 3 セル = 9 人。回転が遅いので長い列は現実には作らない
#     魅力度 0.70
#
#   大型展示ブース(実寸 3×7m = 21m²)
#     capacity 12 : 0.57 人/m²。展示を見て回る密度として妥当
#     180 秒      : 展示の閲覧滞在 2〜5 分
#     魅力度 0.85
#
#   音楽祭ジャズブース(実寸 2×3m)
#     capacity 30 : ブース前で立ち止まって聴く観客。ブース内ではなく前面の滞留
#     600 秒      : 1 ステージ 20〜30 分に対し、来場者が立ち寄って聴く平均滞在は 10 分程度
#     待機列 2 セル : ステージは行列を作らず直接立ち止まるので短く
#     魅力度 0.90
#     ※ capacity 30 は 6m² のブース本体には収まらない。実態としては
#       ブース前面の広場に人だかりができる状態を指す。ただし simulator は
#       体験中の来場者を position=None にしてグリッドから外すため、
#       この滞留は f_congestion に一切反映されない。モデル側の限界。
#
#   ゴミステーション(実寸 2×3m)
#     capacity 4 : 分別ボックス 4 口に同時に 4 名
#     20 秒      : 分別して捨てるだけ
#     ※ 全 46 個中 1 基しかない。飲食後 85% が立ち寄る設定なので、
#       実運用では増設を検討すべき水準。
#
#   テーブル・椅子(実寸 2×2m)
#     capacity 4 : 2m 角に 4 人掛け(1 人/m²)
#     着席時間は resting.rest_seconds(全体設定)で 900 秒 = 15 分
#
#   前提: これらの体験時間には visitor_profiles.max_visit_seconds(3600 秒)が必要。
#   simulator._join_queue は「残り滞在時間 < 推定待ち + mean_service_seconds」で
#   諦めるため、滞在時間が体験時間に対して短すぎると容量が空いていても入場できない。
# ─────────────────────────────────────────────────────────────────────
#
# 待機列は L 字形(左辺→上辺→右辺、南辺は空けておく)。
