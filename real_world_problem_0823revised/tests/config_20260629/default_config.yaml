# イベント会場ブース配置最適化 既定設定(仕様書 v2 準拠)
grid:
  width: 20          # 20260629: x 方向セル数
  height: 16         # 20260629: y 方向セル数
  cell_size_meters: 1.0

time:
  dt_seconds: 1.0
  duration_seconds: 400      # simulate_result.py の SPEC_DEFAULTS.T
  max_speed_mps: 1.0

capacities:
  default: 3
  queue: 5                   # 20260629: 待機列 1 セル 5 人
  entrance: 10               # 2 セル合計で毎ステップ最大 20 人
  exit: 10

entrance_exit:
  entrance_side: bottom
  exit_side: top
  span_cells: 2
  clearance_cells: 0

booth_geometry:
  reception_position: bottom_left
  exit_position: top_left
  queue_pattern: bottom_then_right
  queue_capacity_per_cell: 5
  queue_walkable: false

simulation:
  n_visitors: 200           # 20 人/step × 400 step
  evaluation_seed: 0
  safe_occupancy_ratio: 0.67 # §12.2
  timeout_seconds: 5.0       # §17.6
  replan_interval_steps: 10  # §9.3
  blocked_replan_count: 3    # §9.3
  softmax_temperature: 0.3   # §8
  q_norm_seconds: 600.0      # §8 Q_norm
  giveup_utility_penalty: 0.5   # §8 諦めブースへの減点
  utility_min_threshold: 0.0    # §8 全候補がこの値未満なら EXITING

utility_weights:             # §8 既定重み
  interest: 1.0
  attract: 0.5
  distance: 1.0
  queue: 0.8
  crowd: 0.6

arrival_profile:             # 400 秒間に 400 人 = 平均 1 人/step
  - [0, 400, 1.0]

constraints:
  min_corridor_width: 1      # 20260629 には最低通路幅の追加制約なし

happiness:                   # §13 補助KPI
  alpha: 0.05
  beta: 0.1
  gamma: 0.3

optimization:                # §15
  population_size: 100
  n_generations: 100
